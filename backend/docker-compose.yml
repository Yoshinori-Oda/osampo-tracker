# DBの接続情報は同じディレクトリの.env(コミットしない)から読み込む。項目はbackend/docs/バックエンド構成.mdを参照。
# 各サービスには必要な接続情報だけを渡す(例: workerにはマイグレーション用のロールを渡さない)
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: location_postgis
    platform: linux/amd64
    environment:
      # 管理用のスーパーユーザー(拡張機能とロールの作成にだけ使う)
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # 以下は初回起動時のスクリプト(db/init/)が使う
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB}
      MIGRATOR_DB_USER: ${MIGRATOR_DB_USER}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      AUTHENTICATOR_DB_PASSWORD: ${AUTHENTICATOR_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      # ディレクトリごとマウントするとイメージの10_postgis.shが隠れるので、ファイル単位でマウントする
      - ./db/init/20_roles_and_databases.sh:/docker-entrypoint-initdb.d/20_roles_and_databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      # マイグレーション(docker compose run --rm api alembic ...)はこのサービスで実行する
      MIGRATOR_DB_USER: ${MIGRATOR_DB_USER}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD}
      PURGE_RETENTION_DAYS: ${PURGE_RETENTION_DAYS:-90}
    ports:
      - "8080:8080"
    volumes:
      # 開発中はソースコードをbind mountし、--reloadで変更を反映する
      - ./app:/app/app
      - ./tests:/app/tests
      - ./migrations:/app/migrations
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # apiと同じイメージで起動コマンドだけを変える。ジョブが重複しないよう1つだけ起動する
  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      PURGE_RETENTION_DAYS: ${PURGE_RETENTION_DAYS:-90}
      PURGE_INTERVAL_HOURS: ${PURGE_INTERVAL_HOURS:-24}
    volumes:
      - ./app:/app/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # 開発用のSMTP受信サーバー。送信したメールはhttp://localhost:8025で確認できる(外部には送らない)
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

  # 同期APIをapiに移植するまで残す(フロントの接続先がまだPostgRESTのため)
  postgrest:
    image: postgrest/postgrest
    ports:
      - "3000:3000"
    environment:
      PGRST_DB_URI: "postgres://authenticator:${AUTHENTICATOR_DB_PASSWORD}@db:5432/${POSTGRES_DB}"
      PGRST_DB_SCHEMA: "public"
      PGRST_DB_ANON_ROLE: "web_anon"
      PGRST_DB_CHANNEL_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy

  # パージ処理をworkerに移すまで残す
  cron:
    build: ./cron
    container_name: location_cron
    depends_on:
      - postgrest

volumes:
  postgis_data:
