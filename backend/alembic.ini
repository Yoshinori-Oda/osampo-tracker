# Alembic(スキーマのマイグレーション)の設定。
# 接続先はここには書かず、migrations/env.pyで環境変数(app.config.settings)から組み立てる。
# 実行例(backendディレクトリで):
#   docker compose run --rm api alembic upgrade head            # 開発用のデータベース
#   docker compose run --rm api alembic -x db=test upgrade head  # テスト用のデータベース

[alembic]
script_location = %(here)s/migrations
# migrations/env.pyから`import app`できるようにする
prepend_sys_path = .
# マイグレーションのファイル名は「連番_内容.py」にする(revisionは手で連番を付ける)
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
