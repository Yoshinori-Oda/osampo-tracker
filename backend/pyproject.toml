[project]
name = "osampo-tracker-backend"
version = "0.1.0"
description = "osampo-trackerのAPIサーバー(FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2",
    "apscheduler>=3.10,<4",
    "alembic>=1.14",
    "geoalchemy2>=0.15",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.uv]
# ライブラリとして配布しないので、プロジェクト自体はパッケージとしてインストールしない
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# テストから`import app`できるようにする
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
